<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070b12;--ink2:#0c121c;--panel:#111926;--panel2:#16202f;--line:#223049;--line2:#2e405e;
  --tx:#e9eef7;--dim:#8d9db7;--mute:#5e6f8b;
  --lime:#c6ff3d;--lime-d:#97c91c;--cyan:#39d4ff;--violet:#a98bff;--amber:#ffb62e;--coral:#ff5d6c;--good:#46e08f;
  --r:14px;--hd:'Barlow Condensed','Arial Narrow',sans-serif;--bd:'Barlow',system-ui,sans-serif;--mo:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,#12304a55,transparent 60%),radial-gradient(900px 500px at -10% 10%,#2a1a4a40,transparent 60%),var(--ink);color:var(--tx);font:15px/1.5 var(--bd);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--hd);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0}
h2{font-size:26px;margin-bottom:10px}h3{font-size:18px;margin:18px 0 8px;color:var(--dim)}h4{font-size:14px;color:var(--mute);margin:14px 0 6px}
p{margin:0 0 10px}a{color:inherit;text-decoration:none}
code{font-family:var(--mo);font-size:12.5px;background:#0a1019;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hint{color:var(--dim);font-size:13px}.hint.center{text-align:center}.dim{color:var(--mute)}.grow{flex:1}
.good{color:var(--good)}.warn{color:var(--amber)}.bad{color:var(--coral)}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:#070b12e6;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--lime),#7be07b);color:#06140a;display:grid;place-items:center}
.mark svg{width:22px;height:22px}
.bn{font:italic 800 24px/1 var(--hd);text-transform:uppercase}.bn em{font-style:italic;color:var(--lime);margin-left:6px;font-weight:700}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tabs a{padding:9px 14px;border-radius:9px;color:var(--dim);font:italic 700 17px/1 var(--hd);text-transform:uppercase;white-space:nowrap}
.tabs a:hover{color:var(--tx);background:var(--panel)}
.tabs a.on{color:#06140a;background:var(--lime)}
.vitals{display:flex;gap:8px;align-items:center}
.vit{display:flex;flex-direction:column;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.vit em{font:500 10px/1.2 var(--mo);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-style:normal}
.vit strong{font:italic 700 16px/1.1 var(--hd);text-transform:uppercase}
.vit.pull strong{color:var(--lime)}.vit.demo strong{color:var(--amber)}
.sync{width:9px;height:9px;border-radius:50%;background:var(--mute)}.sync.synced{background:var(--good)}.sync.local{background:var(--amber)}

main{max-width:1320px;margin:0 auto;padding:24px 24px 80px}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--cyan);background:#1a2740}
.btn.primary{background:var(--lime);border-color:var(--lime);color:#06140a}.btn.primary:hover{background:#d8ff6e}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.file{position:relative;cursor:pointer}.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.link{background:none;border:0;color:var(--cyan);cursor:pointer;padding:0;text-decoration:underline}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--dim);font-weight:600}
input,select,textarea{background:#0a111c;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
textarea{resize:vertical;font-family:var(--mo);font-size:12.5px}
label.chk,label.inl{flex-direction:row;align-items:center;gap:8px;color:var(--tx);font-weight:500}
label.chk input{width:auto}label.inl select{width:auto}label.bottom{align-self:end;padding-bottom:10px}
input[type=range]{padding:0;accent-color:var(--lime);height:22px}
.row{display:flex}.gap{gap:12px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:12px;margin:14px 0}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.split.lore{grid-template-columns:280px 1fr}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:0 12px 40px #00000040}
.split .panel{margin-bottom:0}
.sub{font-size:15px;color:var(--dim);margin-left:8px}
.big{color:var(--lime);font-size:38px;margin-left:10px}
.empty{padding:40px;text-align:center}.empty h3{color:var(--tx)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#2a2008;border:1px solid #5a4410;border-radius:12px;padding:12px 18px;margin-bottom:18px;color:#ffd98a}
.mini-h{margin-top:22px}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding:30px;border-radius:20px;margin-bottom:26px;border:1px solid var(--line2);position:relative;overflow:hidden;background:linear-gradient(120deg,#0d1b2e 0%,#13162b 55%,#0d2a1d 100%)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 38px,#ffffff06 38px 40px);pointer-events:none}
.hero>*{position:relative}
.eyebrow{font:500 11px/1 var(--mo);text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);margin-bottom:12px}
.hero h1{font-size:clamp(44px,6vw,84px);margin-bottom:12px}
.lede{font-size:17px;color:#c3cfe3;max-width:540px}.lede b{color:var(--lime)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.tile{background:#0a111cb0;border:1px solid var(--line);border-radius:12px;padding:12px}
.tile em{display:block;font:500 10px/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-style:normal;margin-bottom:6px}
.tile b{font:italic 800 30px/1 var(--hd)}.tile small{color:var(--mute);font-size:11px;margin-left:4px}
.gaps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.gaps li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#0a111cb0;border:1px solid var(--line);cursor:pointer}
.gaps li:hover{border-color:var(--lime)}.gaps b{font:italic 800 18px var(--hd);color:var(--cyan)}.gaps em{font:500 12px var(--mo);color:var(--lime);font-style:normal}
.pitch{width:100%;max-width:400px;display:block;margin:0 auto}
.pf{stroke:#2a4a3d;stroke-width:1.5}.stripe{fill:#ffffff05}.stripe:nth-of-type(even){fill:transparent}
.pl{stroke:#2a4a3d;stroke-width:1.2;fill:none}
.mline{fill:none;stroke:var(--lime);stroke-width:2.2;stroke-dasharray:5 5;opacity:.65;stroke-linejoin:round}
.node circle{fill:#0b1422;stroke:var(--line2);stroke-width:2;transition:.15s}
.node.filled circle{fill:#10261a;stroke:var(--lime)}
.node.on circle{stroke:var(--cyan);stroke-width:3.5;fill:#0d2a3a}
.node[data-act]{cursor:pointer}.node[data-act]:hover circle{stroke:var(--cyan)}
.node text{text-anchor:middle;fill:var(--tx);pointer-events:none}
.node .t1{font:italic 800 14px var(--hd)}.node.filled .t1{font-size:19px;fill:var(--lime)}
.node .t2{font:500 9px var(--mo);fill:var(--mute)}.node .t3{font:600 10px var(--bd);fill:#c3cfe3}.node .t4{font:500 9px var(--mo);fill:var(--cyan)}

/* rails + cards */
.rail{margin-bottom:30px}
.rail header{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.rail h2{margin:0;font-size:30px}.rail header p{margin:0;color:var(--dim);font-size:13px}
.rail-row{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x proximity}
.rail-row .pc{flex:0 0 172px;scroll-snap-align:start}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:16px;padding:6px 0}
.pc{--c1:#8a5a2b;--c2:#3a2410;--ac:#f0b878;position:relative;padding:12px 12px 10px;border-radius:14px 14px 22px 22px;border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);background:linear-gradient(165deg,var(--c1),var(--c2) 75%);cursor:pointer;transition:.18s;clip-path:polygon(0 0,100% 0,100% 94%,50% 100%,0 94%);padding-bottom:18px}
.pc:hover{transform:translateY(-5px);filter:brightness(1.12)}
.pc.silver{--c1:#7d8aa0;--c2:#2b3446;--ac:#dbe4f5}
.pc.gold{--c1:#b8902a;--c2:#4a3508;--ac:#ffe27a}
.pc.elite{--c1:#1b6c86;--c2:#10213c;--ac:#6df0ff}
.pc-top{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"o n" "p n";gap:0 8px;align-items:start}
.pc-ovr{grid-area:o;font:italic 800 38px/0.95 var(--hd);color:var(--ac)}
.pc-pos{grid-area:p;font:italic 700 15px var(--hd);color:var(--ac);text-transform:uppercase}
.pc-nat{grid-area:n;justify-self:end;font:500 10px var(--mo);color:var(--ac);opacity:.8}
.pc-art{height:70px;display:grid;place-items:center;margin:2px 0 6px}
.pc-art span{font:italic 800 46px/1 var(--hd);color:color-mix(in srgb,var(--ac) 35%,transparent)}
.pc-name{font-size:18px;text-align:center;color:#fff;text-shadow:0 1px 0 #0006;margin:0}
.pc-club{text-align:center;font-size:11px;color:var(--ac);opacity:.85;margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-top:1px solid color-mix(in srgb,var(--ac) 35%,transparent);padding-top:7px}
.pc-scores span{text-align:center;font:italic 800 19px/1 var(--hd);color:#fff}
.pc-scores i{display:block;font:500 8.5px var(--mo);color:var(--ac);font-style:normal;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:500 11px var(--mo);color:#fff}

/* labels, meters */
.lbl{display:inline-block;font:600 10px/1 var(--mo);text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:99px;margin-left:6px}
.lbl.good{background:#46e08f22;color:var(--good)}.lbl.ok{background:#39d4ff22;color:var(--cyan)}.lbl.warn{background:#ffb62e22;color:var(--amber)}.lbl.bad{background:#ff5d6c22;color:var(--coral)}
.pc-foot .lbl{margin:0;background:#000a;}
.meter{position:relative;display:inline-block;width:92px;height:22px;border-radius:6px;background:#0a111c;border:1px solid var(--line);overflow:hidden;vertical-align:middle}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2d6bff,var(--cyan))}
.meter.good i{background:linear-gradient(90deg,#1f9d62,var(--good))}.meter.ok i{background:linear-gradient(90deg,#1f7f9d,var(--cyan))}.meter.warn i{background:linear-gradient(90deg,#b07a10,var(--amber))}.meter.bad i{background:linear-gradient(90deg,#b0303d,var(--coral))}.meter.lore i{background:linear-gradient(90deg,#6a4be0,var(--violet))}
.meter b{position:relative;display:block;text-align:right;padding-right:7px;font:500 12px/20px var(--mo);text-shadow:0 1px 2px #000}
.tag{font:500 10px var(--mo);color:var(--amber);margin-left:6px;text-transform:uppercase}.tag.bad{color:var(--coral)}

/* market */
.posbar{display:flex;flex-wrap:wrap;gap:10px 22px}
.pg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lab{font:500 10px var(--mo);color:var(--mute);text-transform:uppercase;letter-spacing:.12em;margin-right:4px;min-width:56px}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--ink2);color:var(--dim);cursor:pointer;font:italic 700 15px/1 var(--hd);text-transform:uppercase}
.pill:hover{color:var(--tx);border-color:var(--cyan)}.pill.on{background:var(--lime);color:#06140a;border-color:var(--lime)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:var(--ink2);border:0;padding:8px 16px;cursor:pointer;color:var(--dim);font-weight:600}.seg button.on{background:var(--cyan);color:#04141a}
.weights{display:flex;gap:22px;align-items:center;margin-top:14px;flex-wrap:wrap}.w{min-width:170px;flex:1}.w span{display:flex;justify-content:space-between}.w b{color:var(--lime);font-family:var(--mo)}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 10.5px var(--mo);text-transform:uppercase;letter-spacing:.09em;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #1a2438;vertical-align:middle}
.tbl tbody tr[data-act]{cursor:pointer}.tbl tbody tr[data-act]:hover,.tbl td.clk:hover{background:#18243a}
.num{text-align:right}th.num{text-align:right}
.total{font:italic 800 24px var(--hd);color:var(--lime)}
.pname{font-weight:700;display:flex;align-items:center;gap:8px}.psub{font-size:12px;color:var(--dim)}
.ptag{font:italic 700 13px var(--hd);padding:2px 7px;border-radius:6px;background:#8a5a2b;color:#ffd7a8}
.ptag.t-silver{background:#5a6679;color:#eef3fb}.ptag.t-gold{background:#8a6a14;color:#fff0b0}.ptag.t-elite{background:#14566d;color:#a8f4ff}
.star{background:none;border:0;font-size:20px;color:var(--mute);cursor:pointer}.star.on{color:var(--amber)}.star:hover{color:var(--amber)}
.foot{padding:14px 4px 0;color:var(--dim);font-size:13px}
.tbl.small{font-size:13px}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:linear-gradient(180deg,#131c2c,#0b111b);border-left:1px solid var(--line2);z-index:50;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-20px 0 60px #000a}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:#02050acc;z-index:40;opacity:0;pointer-events:none;transition:.25s}
#drawer.open+#scrim{opacity:1;pointer-events:auto}
.dr-in{padding:22px}
.x{float:right;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600}
.dr-card{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;margin:30px 0 14px;background:linear-gradient(165deg,var(--c1,#8a5a2b),var(--c2,#3a2410));--ac:#f0b878}
.dr-card.silver{--c1:#7d8aa0;--c2:#2b3446;--ac:#dbe4f5}.dr-card.gold{--c1:#b8902a;--c2:#4a3508;--ac:#ffe27a}.dr-card.elite{--c1:#1b6c86;--c2:#10213c;--ac:#6df0ff}
.big-ovr{display:block;font:italic 800 64px/0.9 var(--hd);color:var(--ac)}
.dr-card .pc-pos{display:block;font-size:20px}
.dr-card h2{font-size:30px;margin:0 0 4px;color:#fff}.dr-card p{margin:0;font-size:13px;color:#fff;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facts dt{font:500 10px var(--mo);color:var(--mute);text-transform:uppercase}.facts dd{margin:2px 0 0;font:italic 700 18px var(--hd)}
.trio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.trio div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.trio em{display:block;font:500 10px var(--mo);color:var(--mute);text-transform:uppercase;font-style:normal}
.trio b{font:italic 800 36px/1.1 var(--hd)}.trio small{display:block;font-size:11px;color:var(--dim)}
.trio .tot{border-color:var(--lime)}.trio .tot b{color:var(--lime)}
.trio b.good{color:var(--good)}.trio b.ok{color:var(--cyan)}.trio b.warn{color:var(--amber)}.trio b.bad{color:var(--coral)}
.dr-in section{margin-top:18px}.dr-in section h3{margin-top:0}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bars li{display:grid;grid-template-columns:140px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:99px;background:#0a111c;overflow:hidden;display:block}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d6bff,var(--lime))}
.bars b{font:500 12px var(--mo);text-align:right}
.note{font-size:12.5px;color:var(--amber);margin:8px 0 0}
.reasons{margin:0;padding-left:18px;color:#c3cfe3;font-size:14px}.reasons li{margin-bottom:4px}

/* squad, club, lore, data */
.mini{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:m}
.mini li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.mini li:hover{border-color:var(--lime)}.mini li span{grid-column:1;font-size:12px;color:var(--dim)}.mini li em{grid-row:1/3;grid-column:2;font:italic 800 26px var(--hd);color:var(--lime);font-style:italic;align-self:center}
.pb{display:grid;grid-template-columns:100px 1fr 40px;gap:4px 12px;align-items:center;margin:10px 0}.pb small{grid-column:2/4;color:var(--mute);font-size:11.5px}.pb b{font:500 13px var(--mo);text-align:right}
.pb .bar{height:10px}
.list .scroll{max-height:560px;overflow-y:auto;margin:10px 0}.list ul{list-style:none;margin:0;padding:0}
.list button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--dim);cursor:pointer}.list button:hover{background:var(--panel2);color:var(--tx)}.list button.on{background:var(--lime);color:#06140a;font-weight:600}.list i{font-size:11px;opacity:.7}
.editor textarea{min-height:60px}
.how{padding-left:0;list-style:none;counter-reset:s;display:grid;gap:16px;margin:16px 0 0}
.how>li{counter-increment:s;position:relative;padding:4px 0 4px 54px}
.how>li::before{content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:11px;background:var(--lime);color:#06140a;display:grid;place-items:center;font:italic 800 22px var(--hd)}
.how .row{margin-top:8px}
.code{background:#060a10;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;position:relative}
.code pre{margin:0;overflow-x:auto;font:12.5px/1.5 var(--mo);color:#bcd}.code .btn{margin-top:8px}
.drop{display:flex;align-items:center;gap:14px;border:2px dashed var(--line2);border-radius:12px;padding:16px;margin-top:8px}.drop.over{border-color:var(--lime);background:#c6ff3d10}
.report{margin-top:12px;font-size:14px}.report p{margin:0 0 6px}
.alt{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.alt summary{cursor:pointer;color:var(--cyan);font-weight:600}
.note-in{min-width:130px}

@media (max-width:980px){
  .hero,.split,.split.lore{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(2,1fr)}
  .vitals .vit:nth-child(n+3){display:none}.bar-in{padding:10px 14px;gap:12px}main{padding:16px 14px 70px}.hero{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>

<script>
/* Positiespel Bench: scoring engine. Pure functions, no DOM. */
const Engine = (() => {
  const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
  const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const avg = a => { const v = a.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };

  /* ---------- field aliases for SoFIFA / Kaggle style headers ---------- */
  const ALIASES = {
    name: ['name', 'playername', 'player', 'longname', 'shortname', 'fullname'],
    id: ['id', 'sofifaid', 'playerid'],
    age: ['age'],
    ovr: ['ovr', 'ova', 'overall', 'overallrating'],
    pot: ['pot', 'potential'],
    club: ['team', 'club', 'clubname', 'teamname', 'teamcontract'],
    contract: ['contract', 'contractend', 'contractuntil', 'contractvaliduntil', 'contractexpiry'],
    positions: ['positions', 'position', 'pos', 'bestposition', 'playerpositions', 'preferredpositions'],
    nationality: ['nationality', 'nation', 'country', 'nat'],
    league: ['league', 'leaguename'],
    value: ['value', 'marketvalue', 'valueeur'],
    wage: ['wage', 'wageeur', 'salary'],
    release: ['releaseclause', 'release', 'relclause', 'buyoutclause'],
    foot: ['preferredfoot', 'foot', 'pf'],
    weak: ['weakfoot', 'wf'],
    skill: ['skillmoves', 'sm', 'skills'],
    height: ['height'],
    weight: ['weight'],
    playstyles: ['playstyles', 'playstyle', 'traits', 'specialities'],
    playstylesPlus: ['playstylesplus'],
    crossing: ['crossing', 'cro'],
    finishing: ['finishing', 'fin'],
    heading: ['headingaccuracy', 'heading', 'hea'],
    shortPass: ['shortpassing', 'shortpass'],
    volleys: ['volleys', 'vol'],
    dribbling: ['dribbling'],
    curve: ['curve', 'cur'],
    fkAcc: ['fkaccuracy', 'freekickaccuracy', 'fka'],
    longPass: ['longpassing', 'longpass'],
    ballControl: ['ballcontrol', 'bco'],
    acceleration: ['acceleration', 'acc'],
    sprintSpeed: ['sprintspeed', 'sprint'],
    agility: ['agility', 'agi'],
    reactions: ['reactions', 'rea'],
    balance: ['balance', 'bal'],
    shotPower: ['shotpower', 'pow'],
    jumping: ['jumping', 'jum'],
    stamina: ['stamina', 'sta'],
    strength: ['strength', 'str'],
    longShots: ['longshots', 'los'],
    aggression: ['aggression', 'agg'],
    interceptions: ['interceptions', 'inte', 'int'],
    positioning: ['positioning', 'attposition', 'attackingposition', 'attpos'],
    vision: ['vision', 'vis'],
    penalties: ['penalties', 'pen'],
    composure: ['composure', 'com'],
    defAwareness: ['defensiveawareness', 'defawareness', 'marking', 'mar'],
    standTackle: ['standingtackle', 'standtackle', 'stt'],
    slideTackle: ['slidingtackle', 'slidetackle', 'slt'],
    gkDiving: ['gkdiving', 'gkdiv'],
    gkHandling: ['gkhandling', 'gkhan'],
    gkKicking: ['gkkicking', 'gkkic', 'kicking'],
    gkPositioning: ['gkpositioning', 'gkpos'],
    gkReflexes: ['gkreflexes', 'gkref', 'reflexes'],
    pac: ['pac', 'pace'],
    sho: ['sho', 'shooting'],
    pas: ['pas', 'passing'],
    drb: ['dri', 'drb'],
    def: ['def', 'defending'],
    phy: ['phy', 'physical'],
  };
  const ALIAS_LOOKUP = {};
  Object.entries(ALIASES).forEach(([k, arr]) => arr.forEach(a => { if (!ALIAS_LOOKUP[a]) ALIAS_LOOKUP[a] = k; }));

  const ATTR_KEYS = ['crossing', 'finishing', 'heading', 'shortPass', 'volleys', 'dribbling', 'curve', 'fkAcc', 'longPass', 'ballControl', 'acceleration', 'sprintSpeed', 'agility', 'reactions', 'balance', 'shotPower', 'jumping', 'stamina', 'strength', 'longShots', 'aggression', 'interceptions', 'positioning', 'vision', 'penalties', 'composure', 'defAwareness', 'standTackle', 'slideTackle', 'gkDiving', 'gkHandling', 'gkKicking', 'gkPositioning', 'gkReflexes'];
  const FACE_KEYS = ['pac', 'sho', 'pas', 'drb', 'def', 'phy'];
  const NUM_KEYS = ['age', 'ovr', 'pot', 'weak', 'skill', ...ATTR_KEYS, ...FACE_KEYS];

  const POS_TOKENS = ['GK', 'CB', 'LCB', 'RCB', 'LB', 'RB', 'LWB', 'RWB', 'CDM', 'LDM', 'RDM', 'CM', 'LCM', 'RCM', 'CAM', 'LAM', 'RAM', 'LM', 'RM', 'LW', 'RW', 'CF', 'LF', 'RF', 'ST', 'LS', 'RS'];
  const POS_FOLD = { LCB: 'CB', RCB: 'CB', LDM: 'CDM', RDM: 'CDM', LCM: 'CM', RCM: 'CM', LAM: 'CAM', RAM: 'CAM', LS: 'ST', RS: 'ST', LF: 'CF', RF: 'CF' };

  /* ---------- parsers ---------- */
  function money(s) {
    if (s == null || s === '') return null;
    if (typeof s === 'number') return s;
    let t = String(s).replace(/,(?=\d{1,2}\s*[MKBmkb]\b)/, '.').replace(/[,\s]/g, '');
    const m = t.match(/([\d.]+)([MKBmkb])?/);
    if (!m) return null;
    let v = parseFloat(m[1]);
    if (isNaN(v)) return null;
    const u = (m[2] || '').toUpperCase();
    if (u === 'B') v *= 1e9; else if (u === 'M') v *= 1e6; else if (u === 'K') v *= 1e3;
    return v;
  }
  function fmtMoney(v) {
    if (v == null) return '-';
    if (v >= 1e6) return '€' + (v / 1e6).toFixed(v >= 1e8 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (v >= 1e3) return '€' + Math.round(v / 1e3) + 'K';
    return '€' + Math.round(v);
  }
  function contractInfo(s) {
    const t = String(s || '');
    const yrs = t.match(/20\d\d/g);
    const end = yrs ? +yrs[yrs.length - 1] : null;
    const free = !end && /free/i.test(t);
    return { end, free, loan: /loan/i.test(t) };
  }
  function parsePositions(s) {
    const toks = String(s || '').toUpperCase().split(/[^A-Z]+/).filter(t => POS_TOKENS.includes(t));
    const out = [];
    toks.forEach(t => { const f = POS_FOLD[t] || t; if (!out.includes(f)) out.push(f); });
    return out;
  }
  function parseInt0(s) { const m = String(s == null ? '' : s).match(/-?\d+/); return m ? parseInt(m[0], 10) : null; }
  function splitList(s) { return String(s || '').split(/[,;|]/).map(x => x.trim()).filter(Boolean); }

  function csvParse(text, delim) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }

  /** Parse pasted text (TSV from the snippet, or a CSV file) into player objects. */
  function parseTable(text) {
    text = String(text || '').replace(/^﻿/, '').trim();
    if (!text) return { players: [], recognized: [], unknown: [], error: 'Nothing to import yet.' };
    const first = text.split(/\r?\n/)[0];
    const delim = first.includes('\t') ? '\t' : (first.split(';').length > first.split(',').length ? ';' : ',');
    const rows = delim === '\t' ? text.split(/\r?\n/).filter(l => l.trim()).map(l => l.split('\t')) : csvParse(text, delim);
    if (rows.length < 2) return { players: [], recognized: [], unknown: [], error: 'The paste needs a header row and at least one player row.' };
    const headers = rows[0].map(h => String(h).trim());
    const map = headers.map(h => (/\+/.test(h) && norm(h) === 'playstyles') ? 'playstylesPlus' : (ALIAS_LOOKUP[norm(h)] || null));
    // a duplicated header keeps its first column
    const seen = new Set();
    map.forEach((k, i) => { if (k) { if (seen.has(k)) map[i] = null; else seen.add(k); } });
    const recognized = [...seen];
    const unknown = headers.filter((h, i) => !map[i] && h);
    const players = [];
    for (let r = 1; r < rows.length; r++) {
      const cells = rows[r]; const p = {};
      map.forEach((k, i) => {
        if (!k) return;
        const v = cells[i] == null ? '' : String(cells[i]).trim();
        if (v === '') return;
        if (NUM_KEYS.includes(k)) { const n = parseInt0(v); if (n != null) p[k] = n; }
        else p['_' + k] = v;
      });
      if (!p._name) continue;
      players.push(finishPlayer(p));
    }
    return { players, recognized, unknown, error: players.length ? null : 'No player rows could be read. Check that a Name column is present.' };
  }

  function finishPlayer(p) {
    let name = p._name; let positions = parsePositions(p._positions);
    if (!positions.length) {
      const parts = name.split(/\s+/); const found = [];
      while (parts.length > 1 && POS_TOKENS.includes(parts[parts.length - 1].toUpperCase())) found.unshift(parts.pop().toUpperCase());
      if (found.length) { name = parts.join(' '); positions = parsePositions(found.join(' ')); }
    }
    let club = p._club || ''; let contractTxt = p._contract || '';
    if (!contractTxt && /20\d\d|free|loan/i.test(club)) {
      contractTxt = club; club = club.replace(/\s*(on loan|free agent|free|20\d\d.*)$/i, '').trim();
    }
    const ci = contractInfo(contractTxt);
    const out = {
      key: p.id ? 'id' + p.id : norm(name) + '|' + (p.age || '') + '|' + norm(club),
      id: p._id || null, name, age: p.age ?? null, ovr: p.ovr ?? null, pot: p.pot ?? p.ovr ?? null,
      club, nationality: p._nationality || '', league: p._league || '', positions,
      contractEnd: ci.end, free: ci.free, loan: ci.loan,
      value: money(p._value), wage: money(p._wage), release: money(p._release),
      foot: /left/i.test(p._foot || '') ? 'L' : (/right/i.test(p._foot || '') ? 'R' : ''),
      weak: p.weak ?? null, skill: p.skill ?? null,
      playstyles: splitList(p._playstyles).map(x => norm(x) + (/\+/.test(x) ? 'plus' : '')).concat(splitList(p._playstylesPlus).map(x => norm(x).replace(/plus$/, '') + 'plus')),
    };
    ATTR_KEYS.concat(FACE_KEYS).forEach(k => { if (p[k] != null) out[k] = p[k]; });
    return out;
  }

  /* ---------- positions, roles and formations ---------- */
  const POSITIONS = ['GK', 'RB', 'RWB', 'CB', 'LB', 'LWB', 'CDM', 'CM', 'CAM', 'RM', 'LM', 'RW', 'LW', 'CF', 'ST'];
  const GROUPS = [['Goalkeeper', ['GK']], ['Defence', ['RB', 'RWB', 'CB', 'LB', 'LWB']], ['Midfield', ['CDM', 'CM', 'CAM', 'RM', 'LM']], ['Attack', ['RW', 'LW', 'CF', 'ST']]];
  const sideOf = pos => (['RB', 'RWB', 'RM', 'RW'].includes(pos) ? 'R' : (['LB', 'LWB', 'LM', 'LW'].includes(pos) ? 'L' : null));
  const mirrorTok = t => t.replace(/^R/, '#').replace(/^L/, 'R').replace(/^#/, 'L');
  const mirror = m => { const o = {}; Object.entries(m).forEach(([k, v]) => { o[mirrorTok(k)] = v; }); return o; };

  const PS_CB = ['intercept', 'anticipate', 'block', 'jockey', 'pressproven', 'pingedpass', 'longballpass', 'quickstep', 'slidetackle', 'tikitaka', 'incisivepass'];
  const PS_FB = ['quickstep', 'rapid', 'relentless', 'whippedpass', 'jockey', 'intercept', 'slidetackle', 'pressproven', 'technical', 'crossplayer'];
  const PS_DM = ['intercept', 'pressproven', 'tikitaka', 'incisivepass', 'pingedpass', 'longballpass', 'quickstep', 'relentless', 'jockey', 'anticipate', 'bruiser', 'slidetackle', 'technical', 'firsttouch'];
  const PS_CM = ['tikitaka', 'incisivepass', 'pingedpass', 'relentless', 'pressproven', 'firsttouch', 'technical', 'intercept', 'longballpass'];
  const PS_WIDE = ['rapid', 'quickstep', 'technical', 'trickster', 'firsttouch', 'whippedpass', 'incisivepass', 'finesseshot', 'relentless', 'flairpass', 'trivela'];
  const PS_CAM = ['tikitaka', 'incisivepass', 'firsttouch', 'technical', 'flairpass', 'pressproven', 'finesseshot', 'trickster'];
  const PS_ST = ['clinicalfinisher', 'finesseshot', 'powershot', 'chipshot', 'precisionheader', 'acrobatic', 'firsttouch', 'rapid', 'quickstep', 'aerial'];
  const PS_GK = ['footwork', 'farreach', 'crossclaimer', 'rushout'];

  // pos maps are written for the right side; mirror() is applied for left-side slots.
  const ROLE = {
    GK: { name: 'Sweeper keeper', w: { gkReflexes: 3, gkDiving: 2.5, gkHandling: 2, gkPositioning: 2, gkKicking: 3, reactions: 1, sprintSpeed: 0.8, acceleration: 0.8 }, pos: { GK: 1 }, ps: PS_GK },
    RB: { name: 'Full-back', w: { sprintSpeed: 2.5, acceleration: 2.2, stamina: 2.5, crossing: 2, shortPass: 2, defAwareness: 2.2, standTackle: 2, interceptions: 2, dribbling: 1.5, ballControl: 1.5, longPass: 1, reactions: 1, agility: 1, strength: 0.8 }, pos: { RB: 1, RWB: 0.95, LB: 0.86, LWB: 0.82, CB: 0.78, RM: 0.78, CDM: 0.62 }, ps: PS_FB },
    RWB: { name: 'Wing-back', w: { stamina: 3, sprintSpeed: 2.8, acceleration: 2.5, crossing: 3, dribbling: 2, shortPass: 2, ballControl: 1.8, defAwareness: 1.5, standTackle: 1.5, interceptions: 1.2, agility: 1.2, vision: 1, longPass: 1 }, pos: { RWB: 1, RB: 0.94, RM: 0.9, LWB: 0.86, LB: 0.8, RW: 0.8 }, ps: PS_FB },
    CB: { name: 'Ball-playing centre-back', w: { defAwareness: 3, interceptions: 2.5, standTackle: 2, shortPass: 2.5, longPass: 2.5, ballControl: 1.5, composure: 2, sprintSpeed: 2, acceleration: 1.5, reactions: 1, strength: 1, heading: 1, aggression: 0.5, vision: 0.5 }, pos: { CB: 1, CDM: 0.88, RB: 0.8, LB: 0.8, CM: 0.6 }, ps: PS_CB },
    CDM: { name: 'Pivot, builder', w: { shortPass: 3, longPass: 2.2, ballControl: 2.5, vision: 1.5, composure: 2, interceptions: 2.2, defAwareness: 2, standTackle: 1.8, stamina: 2, acceleration: 2, sprintSpeed: 2, agility: 1, reactions: 1, strength: 1, dribbling: 1 }, pos: { CDM: 1, CM: 0.93, CB: 0.85, CAM: 0.7, RB: 0.6, LB: 0.6 }, ps: PS_DM },
    CDM2: { name: 'Pivot, ball-winner', w: { interceptions: 3, defAwareness: 2.5, standTackle: 2.5, stamina: 2.5, acceleration: 2.2, sprintSpeed: 2.2, shortPass: 2.5, ballControl: 2, composure: 1.8, strength: 1.5, aggression: 1, reactions: 1, longPass: 1.5, agility: 1 }, pos: { CDM: 1, CM: 0.93, CB: 0.85, CAM: 0.7, RB: 0.6, LB: 0.6 }, ps: PS_DM },
    CM: { name: 'Central midfielder', w: { shortPass: 3, longPass: 2.2, ballControl: 2.5, vision: 2.2, dribbling: 1.8, stamina: 2.2, interceptions: 1.5, standTackle: 1.2, composure: 2, reactions: 1.2, positioning: 1.2, acceleration: 1.2, agility: 1, longShots: 1, strength: 0.8 }, pos: { CM: 1, CDM: 0.94, CAM: 0.94, RM: 0.8, LM: 0.8, CB: 0.6 }, ps: PS_CM },
    CAM: { name: 'Free eight', w: { vision: 3, shortPass: 3, ballControl: 2.5, dribbling: 2.5, positioning: 2, composure: 2, finishing: 1.5, agility: 1.5, longShots: 1, curve: 0.5, reactions: 1, acceleration: 1 }, pos: { CAM: 1, CM: 0.95, CF: 0.92, RM: 0.9, LM: 0.9, RW: 0.9, LW: 0.9, CDM: 0.75, ST: 0.7 }, ps: PS_CAM },
    RM: { name: 'Wide midfielder', w: { acceleration: 2.5, sprintSpeed: 2, dribbling: 3, agility: 1.5, ballControl: 2, crossing: 2, shortPass: 2, vision: 1, finishing: 1.5, curve: 0.5, stamina: 1.5, composure: 1, positioning: 1.5 }, pos: { RM: 1, RW: 0.96, LM: 0.88, LW: 0.85, RWB: 0.9, CAM: 0.86, RB: 0.78, CM: 0.8, ST: 0.65, CF: 0.7 }, ps: PS_WIDE },
    RW: { name: 'Winger', w: { acceleration: 2.8, sprintSpeed: 2.6, dribbling: 3, agility: 2, ballControl: 2.2, finishing: 2, crossing: 1.5, shortPass: 1.5, vision: 1, curve: 1, positioning: 2, composure: 1.2, shotPower: 0.8, reactions: 1 }, pos: { RW: 1, RM: 0.96, LW: 0.88, LM: 0.85, CAM: 0.86, ST: 0.8, CF: 0.82, RWB: 0.75 }, ps: PS_WIDE },
    CF: { name: 'Second striker', w: { finishing: 2.5, positioning: 2.5, shortPass: 2.2, vision: 1.8, ballControl: 2.5, dribbling: 2.2, composure: 2, acceleration: 1.5, agility: 1.5, reactions: 1.5, longShots: 1, sprintSpeed: 1 }, pos: { CF: 1, ST: 0.97, CAM: 0.9, RW: 0.85, LW: 0.85 }, ps: PS_CAM.concat(['finesseshot', 'clinicalfinisher']) },
    ST: { name: 'Finisher', w: { finishing: 3.5, positioning: 3, composure: 2, shotPower: 1.5, reactions: 1.5, ballControl: 1.5, acceleration: 1.5, sprintSpeed: 1.5, heading: 1, strength: 1, volleys: 0.5, dribbling: 1 }, pos: { ST: 1, CF: 0.97, RW: 0.86, LW: 0.86, CAM: 0.78 }, ps: PS_ST },
    ST2: { name: 'Link striker', w: { finishing: 2.5, positioning: 2.5, composure: 2, shortPass: 2, vision: 1.2, ballControl: 2, dribbling: 1.8, acceleration: 1.5, sprintSpeed: 1.5, reactions: 1.5, shotPower: 1, agility: 1 }, pos: { ST: 1, CF: 1, RW: 0.9, LW: 0.9, CAM: 0.86 }, ps: PS_ST },
  };
  // LM and LW reuse the right-side templates; the side decides which map is mirrored.
  ROLE.LB = ROLE.RB; ROLE.LWB = ROLE.RWB; ROLE.LM = ROLE.RM; ROLE.LW = ROLE.RW;

  const posSlot = pos => ({ id: pos, pos, role: pos === 'CDM' ? 'CDM' : pos, side: sideOf(pos), x: 50, y: 50 });
  const P = (id, pos, x, y, o) => Object.assign({ id, pos, role: pos, side: sideOf(pos), x, y }, o || {});
  const back3 = [P('LCB', 'CB', 22, 75, { side: 'L' }), P('CB', 'CB', 50, 78), P('RCB', 'CB', 78, 75, { side: 'R' })];
  const back4 = [P('LB', 'LB', 10, 72), P('LCB', 'CB', 35, 77, { side: 'L' }), P('RCB', 'CB', 65, 77, { side: 'R' }), P('RB', 'RB', 90, 72)];
  const gk = P('GK', 'GK', 50, 92);
  const pivot = [P('LDM', 'CDM', 37, 55, { role: 'CDM', side: 'L' }), P('RDM', 'CDM', 63, 55, { role: 'CDM2', side: 'R' })];
  const FORMATIONS = {
    '3-2-3-2': { label: '3-2-3-2 (the M)', slots: [P('ST1', 'ST', 34, 11), P('ST2', 'ST', 66, 11, { role: 'ST2' }), P('LM', 'LM', 12, 33), P('CAM', 'CAM', 50, 36), P('RM', 'RM', 88, 33), ...pivot, ...back3, gk], m: ['LM', 'ST1', 'CAM', 'ST2', 'RM'] },
    '3-2-3-2w': { label: '3-2-3-2 with wingers', slots: [P('ST1', 'ST', 34, 11), P('ST2', 'ST', 66, 11, { role: 'ST2' }), P('LW', 'LW', 12, 31), P('CAM', 'CAM', 50, 36), P('RW', 'RW', 88, 31), ...pivot, ...back3, gk], m: ['LW', 'ST1', 'CAM', 'ST2', 'RW'] },
    '3-2-4-1': { label: '3-2-4-1', slots: [P('ST', 'ST', 50, 11), P('LM', 'LM', 12, 33), P('LAM', 'CAM', 38, 32), P('RAM', 'CAM', 62, 32), P('RM', 'RM', 88, 33), ...pivot, ...back3, gk], m: [] },
    '3-5-2': { label: '3-5-2', slots: [P('ST1', 'ST', 34, 11), P('ST2', 'ST', 66, 11, { role: 'ST2' }), P('LWB', 'LWB', 9, 42), P('LCM', 'CM', 32, 38, { side: 'L' }), P('CDM', 'CDM', 50, 56), P('RCM', 'CM', 68, 38, { side: 'R' }), P('RWB', 'RWB', 91, 42), ...back3, gk], m: [] },
    '3-4-3': { label: '3-4-3', slots: [P('LW', 'LW', 14, 15), P('ST', 'ST', 50, 10), P('RW', 'RW', 86, 15), P('LWB', 'LWB', 9, 44), P('LCM', 'CM', 38, 46, { side: 'L' }), P('RCM', 'CM', 62, 46, { side: 'R' }), P('RWB', 'RWB', 91, 44), ...back3, gk], m: [] },
    '4-2-3-1': { label: '4-2-3-1', slots: [P('ST', 'ST', 50, 10), P('LW', 'LW', 14, 30), P('CAM', 'CAM', 50, 32), P('RW', 'RW', 86, 30), ...pivot.map(s => Object.assign({}, s, { x: s.x + (s.x < 50 ? 1 : -1), y: 53 })), ...back4, gk], m: [] },
    '4-3-3': { label: '4-3-3', slots: [P('LW', 'LW', 15, 14), P('ST', 'ST', 50, 10), P('RW', 'RW', 85, 14), P('LCM', 'CM', 30, 38, { side: 'L' }), P('CDM', 'CDM', 50, 52), P('RCM', 'CM', 70, 38, { side: 'R' }), ...back4, gk], m: [] },
    '4-4-2': { label: '4-4-2', slots: [P('ST1', 'ST', 36, 11), P('ST2', 'ST', 64, 11, { role: 'ST2' }), P('LM', 'LM', 11, 34), P('LCM', 'CM', 38, 40, { side: 'L' }), P('RCM', 'CM', 62, 40, { side: 'R' }), P('RM', 'RM', 89, 34), ...back4, gk], m: [] },
    '4-1-4-1': { label: '4-1-4-1', slots: [P('ST', 'ST', 50, 10), P('LM', 'LM', 11, 30), P('LCM', 'CM', 38, 35, { side: 'L' }), P('RCM', 'CM', 62, 35, { side: 'R' }), P('RM', 'RM', 89, 30), P('CDM', 'CDM', 50, 54), ...back4, gk], m: [] },
  };

  /* ---------- system fit ---------- */
  function derivedAttrs(p) {
    // fall back to the six face stats when detailed attributes are missing
    const d = {};
    const f = k => p[k] != null ? p[k] : null;
    const pac = f('pac'), sho = f('sho'), pas = f('pas'), drb = f('drb'), def = f('def'), phy = f('phy');
    const set = (k, v) => { if (v != null) d[k] = v; };
    set('shortPass', pas); set('longPass', pas); set('vision', pas); set('crossing', pas);
    set('ballControl', drb); set('dribbling', drb); set('agility', drb);
    set('acceleration', pac); set('sprintSpeed', pac);

<script>
/* Scout Room: app shell, storage, and views. */
(() => {
  'use strict';
  const E = Engine;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const LS_KEY = 'positiespel.state.v1';
  const fmt = E.fmtMoney;

  /* ---------------------------------------------------------------- state */
  const defaultCareer = () => ({
    id: uid(), name: 'My career', clubId: 'brighton-hove-albion', now: { type: 'Summer', year: 2026 },
    formation: '3-2-3-2', budget: 60, wageCap: 150, markup: 1.2, realism: 0.8,
    weights: { fit: 50, will: 30, lore: 20 }, incumbents: {}, windows: [], watchlist: [],
  });
  function defaults() {
    const c = defaultCareer();
    return { v: 2, savedAt: 0, careers: [c], activeId: c.id, customProfiles: {}, hidden: [], ui: { tab: 'home', pos: 'LINEUP', sort: 'total', q: '', minOvr: 0, maxAge: 40, hideUnlikely: false, oop: false, affordable: false, limit: 48, view: 'list', drawer: null, squadSlot: null, loreId: null, loreQ: '' } };
  }
  function adopt(o) {
    const d = defaults(); const s = Object.assign(d, o, { ui: Object.assign(d.ui, o.ui || {}) });
    if (s.ui.tab === 'targets') s.ui.tab = 'market';
    if (!s.ui.pos || s.ui.pos === 'ALL') s.ui.pos = 'LINEUP';
    s.careers.forEach(c => { if (!E.FORMATIONS[c.formation]) c.formation = '3-2-3-2'; });
    return s;
  }
  let S = defaults();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); if (o && o.careers && o.careers.length) S = adopt(o); } } catch (e) { /* storage unavailable */ }

  let DB = [];
  let DEMO = false;
  let cloud = { status: 'checking', ref: null };
  const career = () => S.careers.find(c => c.id === S.activeId) || S.careers[0];

  /* ------------------------------------------------------------- storage */
  let saveTimer = null;
  function save() {
    S.savedAt = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const json = JSON.stringify(S);
      try { localStorage.setItem(LS_KEY, json); } catch (e) { /* ignore */ }
      if (cloud.ref) {
        try { await cloud.ref.set({ json, savedAt: S.savedAt }); cloud.status = 'synced'; } catch (e) { cloud.status = 'local'; }
        renderHeader();
      }
    }, 900);
  }
  async function initCloud() {
    try {
      if (typeof claude === 'undefined' || !claude.use) { cloud.status = 'local'; return renderHeader(); }
      const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
      if (!user || !db) { cloud.status = 'local'; return renderHeader(); }
      const id = await user.id();
      cloud.ref = db.collection('data/users/' + id).doc('positiespel');
      const snap = await cloud.ref.get();
      const data = snap && (typeof snap.data === 'function' ? snap.data() : (snap.data !== undefined ? snap.data : snap));
      if (data && data.json) {
        const remote = JSON.parse(data.json);
        if (remote && remote.careers && (remote.savedAt || 0) > (S.savedAt || 0)) {
          S = adopt(remote);
          try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
        }
      }
      cloud.status = 'synced'; renderAll();
    } catch (e) { cloud.status = 'local'; renderHeader(); }
  }

  const idb = {
    open() { return new Promise((res, rej) => { try { const r = indexedDB.open('positiespel', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
    async get(k) { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
    async set(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
    async del(k) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  };
  async function loadPlayers() {
    try { const v = await idb.get('players'); if (v && v.length) { DB = v; DEMO = false; return; } } catch (e) { /* no idb */ }
    DB = makeDemo(); DEMO = true;
  }
  async function persistPlayers() { try { await idb.set('players', DB); return true; } catch (e) { return false; } }

  /* --------------------------------------------------------- profile data */
  function allProfiles() {
    const map = {};
    BUILTIN_CLUBS.forEach(c => { if (!S.hidden.includes(c.id)) map[c.id] = c; });
    Object.values(S.customProfiles).forEach(c => { map[c.id] = c; });
    return Object.values(map).sort((a, b) => (a.league + a.name).localeCompare(b.league + b.name));
  }
  const getProfile = id => S.customProfiles[id] || BUILTIN_CLUBS.find(c => c.id === id) || null;
  let clubCache = null;
  function lookupClub(name) {
    const k = E.norm(name); if (!k) return null;
    if (!clubCache) clubCache = new Map();
    if (clubCache.has(k)) return clubCache.get(k);
    const ps = allProfiles(); let hit = ps.find(p => E.norm(p.name) === k);
    if (!hit) {
      const cands = ps.filter(p => { const pk = E.norm(p.name); return pk.length >= 6 && (k.includes(pk) || (k.length >= 6 && pk.includes(k))); });
      cands.sort((a, b) => E.norm(b.name).length - E.norm(a.name).length); hit = cands[0] || null;
    }
    clubCache.set(k, hit); return hit;
  }

  /* ------------------------------------------------------------- context */
  const formation = () => E.FORMATIONS[career().formation] || E.FORMATIONS['3-2-3-2'];
  const slotAny = id => formation().slots.find(s => s.id === id) || E.posSlot(id);
  function buildCtx() {
    const c = career(); const prof = getProfile(c.clubId);
    const pullInfo = E.clubPull(prof, c.windows);
    const seasonEnd = c.now.type === 'Summer' ? c.now.year + 1 : c.now.year;
    return {
      profile: prof, pull: pullInfo.pull, pullInfo, lookupClub, realism: c.realism, wageCap: c.wageCap * 1e3, budget: c.budget * 1e6, markup: c.markup, seasonEnd,
      incumbentFor: slot => { if (c.incumbents[slot.id]) return c.incumbents[slot.id]; const m = formation().slots.find(s => s.pos === slot.pos && c.incumbents[s.id]); return m ? c.incumbents[m.id] : null; },
      weights: c.weights, oop: S.ui.oop,
    };
  }
  function candidateSlots(pos) {
    if (pos === 'LINEUP') return formation().slots;
    if (pos === 'ANY') return E.POSITIONS.map(E.posSlot);
    return [E.posSlot(pos)];
  }

  /** Rank the player pool. opts.pos overrides the position filter, opts.raw skips the filter bar. */
  function rank(opts = {}) {
    const ctx = buildCtx(); const u = S.ui; const raw = !!opts.raw; const q = raw ? '' : E.norm(u.q);
    const cand = candidateSlots(opts.pos || u.pos);
    const out = [];
    for (const p of DB) {
      if (p.ovr == null) continue;
      if (!raw) {
        if (u.minOvr && p.ovr < u.minOvr) continue;
        if (u.maxAge && p.age != null && p.age > u.maxAge) continue;
        if (q && !(E.norm(p.name).includes(q) || E.norm(p.club).includes(q) || E.norm(p.nationality).includes(q))) continue;
      }
      let best = null;
      for (const s of cand) {
        if (!(raw ? false : u.oop) && !E.posFactor(p, s)) continue;
        const ev = E.evaluate(p, s, ctx);
        if (!best || ev.total > best.total) best = ev;
      }
      if (!best) continue;
      if (!raw && u.hideUnlikely && best.will < 35) continue;
      if (!raw && u.affordable && best.willInfo.over) continue;
      out.push({ p, ev: best });
    }
    const key = { total: r => r.ev.total, fit: r => r.ev.fit, will: r => r.ev.will, lore: r => r.ev.lore, ovr: r => r.p.ovr }[raw ? 'total' : u.sort] || (r => r.ev.total);
    out.sort((a, b) => key(b) - key(a) || b.p.ovr - a.p.ovr);
    return { rows: out, ctx };
  }

  /* --------------------------------------------------------- shared bits */
  const ISO3 = { england: 'ENG', france: 'FRA', germany: 'GER', spain: 'ESP', italy: 'ITA', portugal: 'POR', netherlands: 'NED', belgium: 'BEL', brazil: 'BRA', argentina: 'ARG', norway: 'NOR', sweden: 'SWE', denmark: 'DEN', switzerland: 'SUI', austria: 'AUT', croatia: 'CRO', serbia: 'SRB', poland: 'POL', turkey: 'TUR', uruguay: 'URU', colombia: 'COL', ecuador: 'ECU', mexico: 'MEX', usa: 'USA', canada: 'CAN', japan: 'JPN', southkorea: 'KOR', morocco: 'MAR', senegal: 'SEN', nigeria: 'NGA', ghana: 'GHA', ivorycoast: 'CIV', egypt: 'EGY', cameroon: 'CMR', algeria: 'ALG', scotland: 'SCO', wales: 'WAL', ireland: 'IRL', republicofireland: 'IRL', czechrepublic: 'CZE', ukraine: 'UKR', hungary: 'HUN', slovenia: 'SVN', slovakia: 'SVK', greece: 'GRE', finland: 'FIN', iceland: 'ISL', paraguay: 'PAR', chile: 'CHI', peru: 'PER', venezuela: 'VEN', australia: 'AUS', georgia: 'GEO', albania: 'ALB', kosovo: 'KOS', romania: 'ROU', bulgaria: 'BUL', mali: 'MLI', guinea: 'GUI', tunisia: 'TUN', drcongo: 'COD', northernireland: 'NIR', bosniaandherzegovina: 'BIH', northmacedonia: 'MKD', montenegro: 'MNE', israel: 'ISR', jamaica: 'JAM', iran: 'IRN', china: 'CHN', saudiarabia: 'KSA', uzbekistan: 'UZB', armenia: 'ARM' };
  const nat3 = n => n ? (ISO3[E.natKey(n)] || n.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase()) : '';
  const tierOf = o => o >= 85 ? 'elite' : o >= 78 ? 'gold' : o >= 70 ? 'silver' : 'bronze';
  const initials = n => n.replace(/^Demo\s+/, '').split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const shortName = n => { if (n.length <= 15) return n; const w = n.split(/\s+/); return w.length > 1 ? w[0][0] + '. ' + w.slice(1).join(' ') : n; };
  const willClass = l => ({ Likely: 'good', Possible: 'ok', Reach: 'warn', Unlikely: 'bad' }[l]);
  const meter = (v, cls) => `<span class="meter ${cls || ''}" role="img" aria-label="${v} of 100"><i style="width:${E.clamp(v)}%"></i><b>${v}</b></span>`;

  function card(r) {
    const p = r.p, e = r.ev;
    return `<article class="pc ${tierOf(p.ovr)}" data-act="open" data-v="${esc(p.key)}" tabindex="0" aria-label="${esc(p.name)}, ${p.ovr} overall">
      <div class="pc-top"><b class="pc-ovr">${p.ovr}</b><span class="pc-pos">${esc(p.positions[0] || '?')}</span><span class="pc-nat">${esc(nat3(p.nationality))}</span></div>
      <div class="pc-art" aria-hidden="true"><span>${esc(initials(p.name))}</span></div>
      <h3 class="pc-name">${esc(shortName(p.name))}</h3>
      <p class="pc-club">${esc(p.club || 'Free agent')} · ${p.age ?? '?'}</p>
      <div class="pc-scores"><span><i>Fit</i>${e.fit}</span><span><i>Sign</i>${e.will}</span><span><i>Lore</i>${e.lore}</span></div>
      <div class="pc-foot"><span>${p.free ? 'Free' : fmt(e.willInfo.price)}</span><span class="lbl ${willClass(e.willInfo.label)}">${e.willInfo.label}</span></div>
    </article>`;
  }

  const tabs = [['home', 'Home'], ['market', 'Market'], ['squad', 'Squad'], ['club', 'Club'], ['lore', 'Lore'], ['watch', 'Watchlist'], ['data', 'Data']];

  function renderHeader() {
    const c = career(); const prof = getProfile(c.clubId); const ctx = buildCtx();
    const sync = cloud.status === 'synced' ? ['synced', 'Saved to your account'] : (cloud.status === 'checking' ? ['', 'Checking save'] : ['local', 'Saved in this browser']);
    $('#hdr').innerHTML = `
      <div class="bar-in">
        <a class="brand" href="#home" data-act="tab" data-v="home"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M3 27 L9 6 L16 20 L23 6 L29 27" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span><span class="bn">Scout<em>Room</em></span></a>
        <nav class="tabs" aria-label="Sections">${tabs.map(([k, l]) => `<a href="#${k}" class="${S.ui.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${l}</a>`).join('')}</nav>
        <div class="vitals">
          <span class="vit"><em>${esc(c.now.type)} ${c.now.year}</em><strong>${esc(prof ? prof.name : 'Pick a club')}</strong></span>
          <span class="vit pull"><em>Pull</em><strong>${ctx.pull}</strong></span>
          ${DEMO ? '<span class="vit demo"><em>Data</em><strong>Demo</strong></span>' : `<span class="vit"><em>Players</em><strong>${DB.length.toLocaleString()}</strong></span>`}
          <span class="sync ${sync[0]}" title="${sync[1]}"></span>
        </div>
      </div>`;
  }

  /* ----------------------------------------------------------------- Home */
  function bestXI(ctx) {
    const slots = formation().slots; const used = new Set(); const res = {};
    const order = [...slots].sort((a, b) => (a.pos === 'GK' ? -1 : 0) - (b.pos === 'GK' ? -1 : 0));
    order.forEach(s => {
      let best = null;
      for (const p of DB) {
        if (used.has(p.key) || p.ovr == null) continue;
        if (!E.posFactor(p, s)) continue;
        const ev = E.evaluate(p, s, ctx);
        if (ev.will < 40) continue;
        if (!best || ev.total > best.ev.total) best = { p, ev };
      }
      if (best) { used.add(best.p.key); res[s.id] = best; }
    });
    return res;
  }

  /* ----------------------------------------------------------------- Data */
  /* Runs inside sofifa.com (pasted in the console). Reads every page of the current list. */
  function scraper() {
    const tx = e => e.innerText !== undefined ? e.innerText : e.textContent;
    const clean = s => (s || '').replace(/\s+/g, ' ').trim();
    const nameLink = c => [...c.querySelectorAll('a[href*="/player/"]')].find(a => clean(tx(a)));
    const teamLink = c => [...c.querySelectorAll('a[href*="/team/"]')].find(a => clean(tx(a)));
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function extract(doc) {
      const t = doc.querySelector('table'); if (!t) return null;
      const heads = [...t.querySelectorAll('thead th')].map(h => clean(tx(h)) || h.getAttribute('data-col') || '');
      const rows = [...t.querySelectorAll('tbody tr')]; if (!rows.length) return { cols: [], lines: [] };
      const cols = [];
      [...rows[0].children].forEach((c, i) => {
        if (nameLink(c)) cols.push('Name', 'ID', 'Positions', 'Nationality');
        else if (teamLink(c)) cols.push('Team', 'Contract');
        else cols.push(heads[i] || c.getAttribute('data-col') || 'col' + i);
      });
      const lines = rows.map(r => {
        const line = [];
        [...r.children].forEach(c => {
          const n = nameLink(c), tm = teamLink(c);
          if (n) {
            const id = (n.getAttribute('href').match(/player\/(\d+)/) || [])[1] || '';
            const pos = [...c.querySelectorAll('.pos, span[class*="pos"]')].map(x => clean(tx(x))).filter(Boolean).join(' ');
            const flag = c.querySelector('img.flag, img[class*="flag"]');
            let nm = clean(tx(n)); const pl = pos.split(' ').filter(Boolean);
            for (let k = 0; k < 6; k++) { const hit = pl.find(q => nm.endsWith(q) && nm.length > q.length); if (!hit) break; nm = nm.slice(0, nm.length - hit.length).trim(); }
            line.push(nm, id, pos, flag ? (flag.getAttribute('title') || flag.getAttribute('alt') || '') : '');
          } else if (tm) { const name = clean(tx(tm)); line.push(name, clean(tx(c)).replace(name, '').trim()); }
          else line.push(clean(tx(c)));
        });
        return line;
      });
      return { cols, lines };
    }
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;z-index:2147483647;right:16px;bottom:16px;max-width:340px;padding:14px 16px;border-radius:12px;background:#0b111b;color:#e9eef7;font:14px/1.4 system-ui,sans-serif;border:2px solid #c6ff3d;box-shadow:0 10px 40px #000a';
    const say = m => { box.textContent = 'Scout Room: ' + m; };
    document.body.appendChild(box);
    (async () => {
      const first = extract(document);
      if (!first || !first.lines.length) { say('I can not see a player table here. Open a players list first (sofifa.com/players).'); return; }
      const asked = prompt('How many pages should I read? Each page has ' + first.lines.length + ' players. Type 0 to read the whole list.', '10');
      if (asked === null) { box.remove(); return; }
      const maxPages = +asked > 0 ? +asked : 400;
      const idCol = first.cols.indexOf('ID'); const seen = new Set(); const all = [];
      const add = r => { r.lines.forEach(l => { const id = idCol >= 0 ? l[idCol] : l.join('|'); if (!seen.has(id)) { seen.add(id); all.push(l); } }); };
      add(first);
      const step = first.lines.length; const base = new URL(location.href); const start = +(base.searchParams.get('offset') || 0);
      for (let p = 1; p < maxPages; p++) {
        say('reading page ' + (p + 1) + ' of ' + (maxPages === 400 ? 'all' : maxPages) + '. ' + all.length + ' players so far. Keep this tab open.');
        await sleep(3000 + Math.random() * 3000);
        base.searchParams.set('offset', start + p * step);
        let res; try { res = await fetch(base.href, { credentials: 'include' }); } catch (e) { say('the network stopped me on page ' + (p + 1) + '. Saving what I have.'); break; }
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const r = extract(doc);
        if (!r || !r.lines.length) { say('page ' + (p + 1) + ' had no players (end of list, or SoFIFA asked for a check). Saving what I have.'); await sleep(1500); break; }
        const before = all.length; add(r); if (all.length === before) break;
      }
      const text = [first.cols.join('\t'), ...all.map(l => l.join('\t'))].join('\n');
      const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/tab-separated-values;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = 'scout_room_players.tsv'; document.body.appendChild(a); a.click(); a.remove();
      try { await navigator.clipboard.writeText(text); } catch (e) { /* download is enough */ }
      say('done, ' + all.length + ' players saved as scout_room_players.tsv in your Downloads. Upload it in Scout Room (Data tab).');
      setTimeout(() => box.remove(), 20000);
    })();
  }

  function makeDemo() {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const pick = a => a[Math.floor(rnd() * a.length)]; const n = (m, sd) => Math.round(m + (rnd() + rnd() + rnd() - 1.5) * sd * 1.6);
    const nations = ['England', 'France', 'Netherlands', 'Germany', 'Spain', 'Portugal', 'Brazil', 'Argentina', 'Belgium', 'Italy', 'Norway', 'Japan'];
    const clubs = ['Ajax', 'Benfica', 'Sporting CP', 'Brighton & Hove Albion', 'Lyon', 'Atalanta', 'Real Sociedad', 'Feyenoord', 'Villarreal', 'Girona', 'Eintracht Frankfurt', 'AS Monaco'];
    const A = {
      GK: { gkReflexes: 80, gkDiving: 78, gkHandling: 76, gkPositioning: 77, gkKicking: 72, reactions: 76, sprintSpeed: 50, acceleration: 50 },
      CB: { defAwareness: 80, interceptions: 78, standTackle: 80, shortPass: 68, longPass: 66, ballControl: 64, composure: 74, sprintSpeed: 68, acceleration: 64, reactions: 74, strength: 78, heading: 78, aggression: 74, vision: 55 },
      FB: { sprintSpeed: 80, acceleration: 80, stamina: 82, crossing: 74, shortPass: 70, defAwareness: 72, standTackle: 72, interceptions: 70, dribbling: 72, ballControl: 72, longPass: 64, reactions: 72, agility: 76, strength: 66 },
      CDM: { shortPass: 78, longPass: 74, ballControl: 76, vision: 70, composure: 74, interceptions: 76, defAwareness: 74, standTackle: 76, stamina: 80, acceleration: 70, sprintSpeed: 70, agility: 70, reactions: 76, strength: 72, dribbling: 72, aggression: 72 },
      CM: { shortPass: 80, longPass: 76, ballControl: 80, vision: 76, dribbling: 76, stamina: 80, interceptions: 68, standTackle: 66, composure: 76, reactions: 76, positioning: 72, acceleration: 72, agility: 74, longShots: 70, strength: 68 },
      CAM: { vision: 80, shortPass: 80, ballControl: 82, dribbling: 80, positioning: 76, composure: 76, finishing: 70, agility: 78, longShots: 72, reactions: 78, acceleration: 74, curve: 70 },
      WIDE: { acceleration: 82, sprintSpeed: 82, dribbling: 80, agility: 82, ballControl: 78, crossing: 72, shortPass: 72, vision: 68, finishing: 70, stamina: 74, composure: 70, positioning: 74, curve: 68 },
      ST: { finishing: 80, positioning: 80, composure: 74, shotPower: 78, reactions: 77, ballControl: 74, acceleration: 74, sprintSpeed: 76, heading: 70, strength: 70, volleys: 72, dribbling: 72, shortPass: 62, vision: 60, agility: 70 },
    };
    const mix = [['GK', 'GK', 6], ['CB', 'CB', 18], ['FB', 'RB', 7], ['FB', 'LB', 7], ['FB', 'RWB', 3], ['FB', 'LWB', 3], ['CDM', 'CDM', 14], ['CM', 'CM', 12], ['CAM', 'CAM', 10], ['WIDE', 'RM', 5], ['WIDE', 'LM', 5], ['WIDE', 'RW', 6], ['WIDE', 'LW', 6], ['ST', 'CF', 4], ['ST', 'ST', 14]];
    const out = []; let i = 0;
    mix.forEach(([arch, pos, cnt]) => {
      for (let k = 0; k < cnt; k++) {
        i++; const p = { demo: true, key: 'demo' + i, id: null, name: `Demo ${pos} ${String(k + 1).padStart(2, '0')}`, age: E.clamp(n(25, 5), 17, 37), club: pick(clubs), nationality: pick(nations), positions: [pos], playstyles: [] };
        if (rnd() < 0.25) p.positions.push(pick(['CM', 'CDM', 'RM', 'LM', 'CAM', 'RB', 'LB'].filter(x => x !== pos)));
        const lvl = n(0, 7); p.ovr = E.clamp(n(77, 5), 62, 90); p.pot = E.clamp(p.ovr + Math.max(0, 28 - p.age) + n(1, 2), p.ovr, 94);

    if (!o || typeof o !== 'object' || !o.name) throw new Error('Each profile needs a name.');
    const sources = {};
    if (Array.isArray(o.sources)) o.sources.forEach(s => { if (s && s.country) sources[s.country] = +s.weight || 0; }); else Object.entries(o.sources || {}).forEach(([k, v]) => { sources[k] = +v || 0; });
    const arr = v => Array.isArray(v) ? v.map(String) : String(v || '').split(';').map(x => x.trim()).filter(Boolean);
    const st = o.style || {}; const num = (v, d) => (typeof v === 'number' ? v : d);
    return { id: o.id || slug(o.name), name: String(o.name), league: String(o.league || 'Other'), country: String(o.country || ''), prestige: E.clamp(num(+o.prestige, 55)), sources, feeders: arr(o.feeders), feederLeagues: arr(o.feederLeagues), ties: arr(o.ties), rivals: arr(o.rivals), style: { youth: num(st.youth, 5), veteran: num(st.veteran, 5), physical: num(st.physical, 5), technical: num(st.technical, 5), pace: num(st.pace, 5) }, ageIdeal: Array.isArray(o.ageIdeal) && o.ageIdeal.length === 2 ? o.ageIdeal.map(Number) : [18, 32], notes: String(o.notes || ''), builtin: false };
  }

  document.addEventListener('click', async ev => {
    const t = ev.target.closest('[data-act]'); const ov = ev.target.id === 'scrim';
    if (ov) return closeDrawer();
    if (!t) return;
    const act = t.dataset.act, v = t.dataset.v; const c = career();
    if (t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
    if (act === 'tab') { ev.preventDefault(); return setTab(v); }
    if (act === 'pos') { S.ui.pos = v; S.ui.limit = 48; save(); return renderView(); }
    if (act === 'view') { S.ui.view = v; save(); return renderView(); }
    if (act === 'open') { if (ev.target.closest('.star')) return; return openPlayer(v, t.dataset.pos); }
    if (act === 'close') return closeDrawer();
    if (act === 'more') { S.ui.limit += 48; return renderResults(); }
    if (act === 'watch') { ev.stopPropagation(); addWatch(v); save(); renderView(); return renderDrawer(); }
    if (act === 'sq') { S.ui.squadSlot = v; return renderView(); }
    if (act === 'career-new') { const n = defaultCareer(); n.name = 'Career ' + (S.careers.length + 1); n.clubId = c.clubId; S.careers.push(n); S.activeId = n.id; save(); return renderAll(); }
    if (act === 'career-del') { if (S.careers.length < 2) return; S.careers = S.careers.filter(x => x.id !== c.id); S.activeId = S.careers[0].id; save(); return renderAll(); }
    if (act === 'win-add') {
      const g = id => $('#' + id); const size = +g('w-size').value || 20;
      c.windows.push({ id: uid(), label: `${c.now.type} ${c.now.year}`, leaguePos: E.clamp(+g('w-pos').value || 8, 1, size), leagueSize: size, europe: +g('w-eu').value, cups: +g('w-cups').value || 0, euroWon: g('w-ew').checked, teamOvr: +g('w-ovr').value || null });
      save(); return renderAll();
    }
    if (act === 'win-del') { c.windows = c.windows.filter(w => w.id !== v); save(); return renderAll(); }
    if (act === 'lore-pick') { S.ui.loreId = v; return renderView(); }
    if (act === 'lore-new') { const id = 'club-' + uid(); S.customProfiles[id] = normaliseProfile({ id, name: 'New club', league: 'Other', prestige: 55, sources: {}, style: {} }); S.ui.loreId = id; save(); return renderAll(); }
    if (act === 'lore-save') { S.customProfiles[v] = readProfileForm(v); save(); renderAll(); return flash($('#lore-msg'), 'Saved.'); }
    if (act === 'lore-reset') { delete S.customProfiles[v]; save(); return renderAll(); }
    if (act === 'lore-del') { delete S.customProfiles[v]; S.ui.loreId = null; if (c.clubId === v) c.clubId = BUILTIN_CLUBS[0].id; save(); return renderAll(); }
    if (act === 'copy-json') { const p = Object.assign({}, getProfile(v)); delete p.builtin; delete p.id; const ok = await copyText(JSON.stringify(p, null, 2)); return flash($('#lore-msg'), ok ? 'Copied.' : 'Copy was blocked. Select the profile text and copy it by hand.'); }
    if (act === 'copy-prompt') { const ok = await copyText(LORE_PROMPT); return flash($('#lore-msg'), ok ? 'Request template copied. Send it to Claude with the club name filled in.' : LORE_PROMPT); }
    if (act === 'lore-paste') {
      try {
        const txt = $('#e-paste').value.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim(); const data = JSON.parse(txt); const list = Array.isArray(data) ? data : [data];
        let added = 0, last = null; list.forEach(o => { const p = normaliseProfile(o); S.customProfiles[p.id] = p; last = p.id; added++; });
        S.ui.loreId = last; save(); renderAll(); flash($('#lore-msg'), `Added ${added} club${added === 1 ? '' : 's'}.`);
      } catch (e) { flash($('#lore-msg'), 'That did not read as a profile: ' + e.message); }
      return;
    }
    if (act === 'copy-snippet') { const ok = await copyText(SNIPPET); t.textContent = ok ? 'Copied' : 'Copy blocked, select the text by hand'; return; }
    if (act === 'import') return doImport($('#d-paste').value);
    if (act === 'clear-players') { DB = makeDemo(); DEMO = true; try { await idb.del('players'); } catch (e) { /* ignore */ } return renderAll(); }
    if (act === 'backup') { const ok = await copyText(JSON.stringify(S)); return flash($('#d-bmsg'), ok ? 'Backup copied.' : 'Copy blocked. Your save is also stored in this browser.'); }
    if (act === 'restore') { try { const o = JSON.parse($('#d-backup').value); if (!o.careers) throw new Error('This is not a backup.'); S = adopt(o); save(); renderAll(); flash($('#d-bmsg'), 'Restored.'); } catch (e) { flash($('#d-bmsg'), 'Could not restore: ' + e.message); } return; }
  });

  async function doImport(text) {
    const rep = $('#d-report'); const r = E.parseTable(text);
    if (r.error) { rep.innerHTML = `<p class="bad">${esc(r.error)}</p>`; return; }
    if (DEMO) DB = [];
    const map = new Map(DB.map(p => [p.key, p])); let added = 0, updated = 0;
    r.players.forEach(p => { if (map.has(p.key)) updated++; else added++; map.set(p.key, p); });
    DB = [...map.values()]; DEMO = false; clubCache = null;
    const stored = await persistPlayers();
    const withAttr = r.players.filter(p => E.ATTR_KEYS.filter(k => p[k] != null).length >= 20).length;
    const usable = r.players.filter(p => E.ATTR_KEYS.filter(k => p[k] != null).length >= 10 || E.FACE_KEYS.filter(k => p[k] != null).length >= 4).length;
    const missing = ['name', 'age', 'ovr', 'pot', 'club', 'positions', 'nationality', 'value', 'wage', 'contract'].filter(k => !r.recognized.includes(k));
    const unk = r.unknown.filter(h => !/^col\d+$/.test(h));
    rep.innerHTML = `
      <p class="good"><b>${added} added, ${updated} updated.</b> ${DB.length.toLocaleString()} players are in the bench.${stored ? '' : ' Storage is blocked in this browser, so they will be gone after a reload.'}</p>
      <p>${withAttr} of ${r.players.length} rows carry the full attribute set. ${usable > withAttr ? 'Some rows only have the six face stats, so they are scored from those and marked <em>est.</em>' : ''}</p>
      ${usable < r.players.length ? `<p class="warn">${r.players.length - usable} rows have no attributes at all, so their system fit shows 0. Switch on the attribute columns on SoFIFA and scan again.</p>` : ''}
      <p class="hint">Recognised columns: ${r.recognized.map(esc).join(', ')}.</p>
      ${missing.length ? `<p class="warn">Not found: ${missing.join(', ')}. Scores that rely on these will be softer.</p>` : ''}
      ${unk.length ? `<p class="hint">Ignored columns: ${unk.slice(0, 12).map(esc).join(', ')}${unk.length > 12 ? '…' : ''}.</p>` : ''}
      <p><a class="btn primary" href="#home" data-act="tab" data-v="home">See your players on Home</a></p>`;
    const pt = $('#d-paste'); if (pt) pt.value = ''; renderHeader();
  }

  document.addEventListener('change', ev => {
    const t = ev.target; const id = t.id; const c = career(); const u = S.ui;
    if (id === 'd-file') { const f = t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(String(rd.result)); rd.readAsText(f); return; }
    if (id === 'dr-pos') { u.drawer.pos = t.value; return renderDrawer(); }
    if (t.dataset.act === 'w-status') { const w = c.watchlist.find(x => x.key === t.dataset.v); if (w) { w.status = t.value; save(); } return; }
    if (t.dataset.act === 'w-note') { const w = c.watchlist.find(x => x.key === t.dataset.v); if (w) { w.note = t.value; save(); } return; }
    const m = {
      'f-min': () => { u.minOvr = +t.value || 0; }, 'f-age': () => { u.maxAge = +t.value || 0; }, 'f-sort': () => { u.sort = t.value; },
      'f-unl': () => { u.hideUnlikely = t.checked; }, 'f-aff': () => { u.affordable = t.checked; }, 'f-oop': () => { u.oop = t.checked; },
    };
    if (m[id]) { m[id](); u.limit = 48; save(); return renderResults(); }
    const cm = {
      'c-name': () => { c.name = t.value; }, 'c-club': () => { c.clubId = t.value; }, 'c-wtype': () => { c.now.type = t.value; }, 'c-wyear': () => { c.now.year = +t.value || 2026; },
      'c-bud': () => { c.budget = +t.value || 0; }, 'c-wage': () => { c.wageCap = +t.value || 0; }, 'c-mark': () => { c.markup = +t.value; }, 'c-real': () => { c.realism = +t.value; },
      's-form': () => { c.formation = t.value; u.squadSlot = null; }, 's-inc': () => { const s = u.squadSlot || formation().slots[0].id; if (t.value) c.incumbents[s] = +t.value; else delete c.incumbents[s]; },
    };
    if (cm[id]) { cm[id](); save(); return renderAll(); }
    if (id === 'c-switch') { S.activeId = t.value; save(); return renderAll(); }
  });
  document.addEventListener('input', ev => {
    const t = ev.target; const id = t.id; const c = career();
    if (id === 'f-q') { S.ui.q = t.value; S.ui.limit = 48; clearTimeout(window.__qt); window.__qt = setTimeout(renderResults, 180); return; }
    if (id.startsWith('w-') && ['fit', 'will', 'lore'].includes(id.slice(2))) { const k = id.slice(2); c.weights[k] = +t.value; const b = $('#wv-' + k); if (b) b.textContent = t.value; save(); clearTimeout(window.__wt); window.__wt = setTimeout(renderResults, 120); return; }
    if (id.startsWith('e-') && ['youth', 'veteran', 'physical', 'technical', 'pace'].includes(id.slice(2))) { const b = $('#ev-' + id.slice(2)); if (b) b.textContent = t.value; return; }
    if (id === 'l-q') { S.ui.loreQ = t.value; const pos = t.selectionStart; renderView(); const n = $('#l-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && S.ui.drawer) return closeDrawer();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[data-act="open"], [data-act="sq"]')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('dragover', ev => { if (ev.target.closest && ev.target.closest('#drop')) { ev.preventDefault(); ev.target.closest('#drop').classList.add('over'); } });
  document.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', ev => {
    const d = ev.target.closest && ev.target.closest('#drop'); if (!d) return; ev.preventDefault(); d.classList.remove('over');
    const f = ev.dataTransfer && ev.dataTransfer.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => doImport(String(rd.result)); rd.readAsText(f);
  });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (tabs.some(([k]) => k === h) && h !== S.ui.tab) { S.ui.tab = h; renderAll(); } });

  /* ------------------------------------------------------------------ boot */
  (async () => {
    const h = location.hash.replace('#', ''); if (tabs.some(([k]) => k === h)) S.ui.tab = h;
    S.ui.drawer = null;
    if (!getProfile(career().clubId)) career().clubId = BUILTIN_CLUBS[0].id;
    await loadPlayers();
    renderAll();
    initCloud();
  })();
  window.__bench = { get S() { return S; }, get DB() { return DB; }, rank, buildCtx, doImport, bestXI };
})();

</script>
</body>
</html>
